# Release notes from the Conventional Commits, for git-cliff:
#   git-cliff --latest --strip header      the notes of the newest tag (the release workflow)
#   git-cliff --unreleased                 what the next release would contain
# Only features, fixes, tests and docs are listed; ci, build, chore and refactor commits are left out.

[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The HTML comments only fix the order of the groups; striptags removes them from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^test", group = "<!-- 2 -->Tests" },
  { message = "^docs", group = "<!-- 3 -->Docs" },
  { message = ".*", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
