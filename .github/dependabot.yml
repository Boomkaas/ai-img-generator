# Weekly update pull requests into develop, where CI tests them like any other change. Minor and patch
# updates come grouped, one pull request per ecosystem; a major update gets its own.
version: 2
updates:
  # pyproject.toml, and the exact versions the images install (infra/docker/constraints.txt).
  - package-ecosystem: pip
    directories: ["/", "/infra/docker"]
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "build(deps)"}
    groups:
      python: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "build(deps)"}
    groups:
      frontend: {update-types: [minor, patch]}

  # The base images of infra/docker/*.Dockerfile.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "ci(deps)"}
    groups:
      actions: {update-types: [minor, patch]}
