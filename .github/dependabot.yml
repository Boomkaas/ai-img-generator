version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/infra/docker"]
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "build(deps)"}
    groups:
      python: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "build(deps)"}
    groups:
      frontend: {update-types: [minor, patch]}

  - package-ecosystem: docker
    directory: /infra/docker
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
    commit-message: {prefix: "ci(deps)"}
    groups:
      actions: {update-types: [minor, patch]}
