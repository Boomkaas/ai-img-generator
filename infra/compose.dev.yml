# Local development services: make dev-up
# Host ports can be overridden when taken, e.g. POSTGRES_PORT=5433 make dev-up (then match DATABASE_URL in .env).
name: imagegen-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: imagegen
      POSTGRES_PASSWORD: imagegen
      POSTGRES_DB: imagegen
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagegen -d imagegen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/minio  # community build: upstream stopped publishing images (ADR 0002)
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: imagegen
      MINIO_ROOT_PASSWORD: imagegen-dev-secret
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket, then exits 0.
  minio-init:
    image: pgsty/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 imagegen imagegen-dev-secret &&
        mc mb --ignore-existing local/imagegen
    restart: "no"

volumes:
  pg-data: {}
  redis-data: {}
  minio-data: {}
