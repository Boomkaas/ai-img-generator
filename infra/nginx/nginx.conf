# Runs as the unprivileged nginx user: it listens on 8080 and 8443, and the stack publishes them as 80 and 443.
worker_processes auto;
worker_rlimit_nofile 8192;      # the container's default soft limit of 1024 is below worker_connections
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;    # every open WebSocket holds two: one to the browser, one to an API server
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 64k;   # the largest request is a prompt of a few hundred characters

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Kept here rather than in the API servers: a limit in each server's memory would be multiplied by
    # the number of servers.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    upstream api_pool {
        least_conn;                                        # suits long-lived WebSockets
        # One "server <ip>:8000 max_fails=3 fail_timeout=10s;" line per app machine, from a Swarm config,
        # so adding a machine needs no image rebuild.
        include /etc/nginx/upstreams.inc;
    }

    server {
        listen 8080;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;

        location / {                                       # user page and admin page
            root /srv/frontend;
            try_files $uri /index.html;
        }

        # Only password guessing and sign-up floods are limited. /api/auth/me and /api/auth/refresh run on
        # every page load, and a class behind one NAT address would hit the limit on them.
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api_pool;
        }

        location /api/ {
            proxy_pass http://api_pool;
        }

        location /ws {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            # A location that sets any proxy_set_header inherits none from the server block,
            # so the forwarding headers are repeated here.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 1h;                         # the default 60 s would close a queued user's quiet socket
            proxy_send_timeout 1h;
        }
    }
}
