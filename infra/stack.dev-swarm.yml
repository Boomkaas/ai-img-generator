services:
  worker:
    image: ${REGISTRY}/imagegen-worker:${TAG}-fake
    environment:
      PIPELINE: fake
      STEP_DELAY_SECONDS: "0"
      FAKE_STEP_SECONDS: "1"
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 512M}
        limits: {cpus: "0.5", memory: 1G}

  controller:
    environment:
      MAX_WORKERS: "3"
      SCALE_UP_WAITING_PER_WORKER: "1"
      COOLDOWN_S: "15"
      SCALE_DOWN_IDLE_S: "60"
