x-app-env: &app_env
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: imagegen
  ALLOWED_ORIGINS: https://${DOMAIN}
  COOKIE_SECURE: "true"
  TZ: ${TZ:-UTC}

x-app-secrets: &app_secrets
  - {source: database_url, target: DATABASE_URL}
  - {source: broker_url, target: BROKER_URL}
  - {source: redis_url, target: REDIS_URL}
  - {source: minio_password, target: S3_SECRET_KEY}
  - {source: jwt_secret, target: JWT_SECRET}

services:
  nginx:
    image: ${REGISTRY}/imagegen-nginx:${TAG}
    ports:
      - {target: 8080, published: 80, mode: host}
      - {target: 8443, published: 443, mode: host}
    configs:
      - {source: nginx_upstreams, target: /etc/nginx/upstreams.inc}
    secrets:
      - {source: tls_cert, target: tls_cert}
      - {source: tls_key, target: tls_key, uid: "101", gid: "101", mode: 0400}
    deploy:
      placement: {constraints: [node.labels.imagegen.infra == true]}

  redis:
    image: redis:7
    command: ["redis-server", "/run/secrets/redis.conf", "--appendonly", "yes"]
    secrets:
      - {source: redis_conf, target: redis.conf}
    volumes: [redis-data:/data]
    deploy:
      placement: {constraints: [node.labels.imagegen.infra == true]}

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: imagegen
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: imagegen
    secrets: [pg_password]
    volumes: [pg-data:/var/lib/postgresql/data]
    deploy:
      placement: {constraints: [node.labels.imagegen.infra == true]}

  minio:
    image: pgsty/minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: imagegen
      MINIO_ROOT_PASSWORD_FILE: minio_password
    secrets: [minio_password]
    volumes: [minio-data:/data]
    deploy:
      placement: {constraints: [node.labels.imagegen.infra == true]}

  backup:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGUSER: imagegen
      PGDATABASE: imagegen
      BACKUP_AT: "03:00"
      BACKUP_KEEP: "7"
      TZ: ${TZ:-UTC}
    secrets: [pg_password]
    volumes: [backups:/backups]
    command:
      - sh
      - -c
      - |
        export PGPASSWORD="$$(cat /run/secrets/pg_password)"
        while :; do
          now=$$(date +%s)
          next=$$(date -d "$$BACKUP_AT" +%s)
          [ "$$next" -gt "$$now" ] || next=$$(date -d "tomorrow $$BACKUP_AT" +%s)
          sleep $$((next - now))
          name=/backups/imagegen-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$name.part" && mv "$$name.part" "$$name"; then
            echo "backup: wrote $$name"
            ls -1t /backups/imagegen-*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f --
          else
            echo "backup: pg_dump failed" >&2
            rm -f "$$name.part"
          fi
        done
    deploy:
      placement: {constraints: [node.labels.imagegen.infra == true]}

  migrate:
    image: ${REGISTRY}/imagegen-api:${TAG}
    command: ["sh", "-c", "alembic upgrade head && python -c 'from common import storage; storage.ensure_bucket()'"]
    environment: *app_env
    secrets: *app_secrets
    healthcheck: {disable: true}
    deploy:
      placement: {constraints: [node.labels.imagegen.infra == true]}
      restart_policy: {condition: on-failure, delay: 30s, max_attempts: 3}

  api:
    image: ${REGISTRY}/imagegen-api:${TAG}
    ports:
      - {target: 8000, published: 8000, mode: host}
    environment:
      <<: *app_env
      DB_POOL_SIZE: "5"
      MACHINE_NAME: "{{.Node.Hostname}}"
    secrets: *app_secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client as h; c = h.HTTPConnection('127.0.0.1', 8000, timeout=4); c.request('GET', '/api/health'); c.getresponse()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${API_REPLICAS:-2}
      placement:
        constraints: [node.labels.imagegen.app == true]
        max_replicas_per_node: 1
      update_config: {order: stop-first}

  worker:
    image: ${REGISTRY}/imagegen-worker:${TAG}
    hostname: "{{.Node.Hostname}}-worker-{{.Task.Slot}}"
    environment:
      <<: *app_env
      DB_POOL_SIZE: "1"
      WORKER_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      STEP_DELAY_SECONDS: "2"
    secrets: *app_secrets
    stop_grace_period: 30m
    deploy:
      replicas: 1
      placement: {constraints: [node.labels.imagegen.app == true]}
      resources:
        reservations: {cpus: "2", memory: 7G}
        limits: {cpus: "2", memory: 8G}
      restart_policy: {condition: any}

  controller:
    image: ${REGISTRY}/imagegen-controller:${TAG}
    environment:
      <<: *app_env
      DB_POOL_SIZE: "2"
      MACHINE_NAME: "{{.Node.Hostname}}"
      SCALER: swarm
      WORKER_SERVICE: imagegen_worker
      MIN_WORKERS: ${MIN_WORKERS:-1}
      MAX_WORKERS: ${MAX_WORKERS:-4}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    secrets: *app_secrets
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager, node.labels.imagegen.infra == true]

volumes:
  redis-data: {}
  pg-data: {}
  minio-data: {}
  backups: {}

configs:
  nginx_upstreams:
    external: true
    name: ${NGINX_UPSTREAMS_CONFIG:-nginx_upstreams}

secrets:
  tls_cert: {external: true}
  tls_key: {external: true}
  jwt_secret: {external: true, name: imagegen_jwt_secret}
  pg_password: {external: true, name: imagegen_pg_password}
  minio_password: {external: true, name: imagegen_minio_password}
  redis_conf: {external: true, name: imagegen_redis_conf}
  database_url: {external: true, name: imagegen_database_url}
  redis_url: {external: true, name: imagegen_redis_url}
  broker_url: {external: true, name: imagegen_broker_url}
